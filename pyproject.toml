[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tomd"
version = "0.1.0"
description = "Academic PDF/DOCX -> AI-friendly Markdown batch preprocessor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "typer>=0.27.0",
]

[project.scripts]
tomd = "cli:app"

[tool.setuptools]
packages = ["tomd", "tomd.parsers"]